# Blueprint de DEMOSTRACIÓN para Render (plan gratuito, sin tarjeta).
# ⚠ Sin disco persistente: la base y las fotos se BORRAN en cada despliegue, reinicio o suspensión
#   (el plan gratuito se suspende tras ~15 min sin visitas). Al volver a arrancar se recarga la demo.
#   Sirve para mostrar la carta, el QR de mesa y el AR; NO para operar el restaurante (usá render.yaml).
#
# Uso: New → Blueprint → repo Carta-Digital → en "Blueprint Path" escribí: render-demo.yaml
services:
  - type: web
    name: carta-digital-demo
    runtime: node
    plan: free
    region: virginia
    branch: main
    buildCommand: bash scripts/render-build.sh
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Almacenamiento efímero dentro del servicio (se pierde al reiniciar).
      - key: DB_PATH
        value: data/menu.sqlite
      - key: UPLOAD_DIR
        value: uploads
      - key: SERVE_FRONTEND_DIR
        value: ../frontend/dist
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "7"
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: LOGIN_LOCK_MINUTES
        value: "15"
      - key: PUBLIC_RATE_LIMIT_PER_MIN
        value: "120"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: strict
      - key: TRUST_PROXY
        value: "1"
      - key: MAX_UPLOAD_MB
        value: "15"
      - key: FISCAL_PROVIDER
        value: interno
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # La demo se recarga en cada arranque (la base empieza vacía).
      - key: SEED_DEMO
        value: "true"
      - key: VITE_API_URL
        value: /api
      - key: VITE_UPLOADS_URL
        value: /uploads
