# Blueprint de Render (https://render.com/docs/blueprint-spec)
# Despliega backend + carta en un único servicio web: el backend sirve la API, /uploads y el frontend compilado
# (mismo dominio → sin CORS, cookies seguras y cámara/AR habilitadas por HTTPS).
#
# Uso: Render Dashboard → New → Blueprint → elegí este repositorio → completá ADMIN_* → Apply.
# Cada push a la rama configurada vuelve a desplegar automáticamente.
services:
  - type: web
    name: carta-digital
    runtime: node
    # SQLite y las fotos/modelos 3D necesitan un disco persistente, que Render solo ofrece en planes pagos.
    plan: starter
    region: virginia
    branch: main
    buildCommand: bash scripts/render-build.sh
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /api/health
    disk:
      name: datos
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # --- Persistencia (disco) ---
      - key: DB_PATH
        value: /var/data/menu.sqlite
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: SERVE_FRONTEND_DIR
        value: ../frontend/dist
      # --- Seguridad ---
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "7"
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: LOGIN_LOCK_MINUTES
        value: "15"
      - key: PUBLIC_RATE_LIMIT_PER_MIN
        value: "120"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: strict
      - key: TRUST_PROXY
        value: "1"
      - key: MAX_UPLOAD_MB
        value: "15"
      - key: FISCAL_PROVIDER
        value: interno
      # PUBLIC_APP_URL y CORS_ORIGINS se toman de RENDER_EXTERNAL_URL (la URL .onrender.com que asigna Render).
      # Si usás un dominio propio, definilos acá o en el panel: https://tudominio.com.ar
      # --- Primer administrador (se piden al crear el Blueprint; nunca quedan en el repo) ---
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # true = carga mesas, carta y usuarios de demostración solo si la base está vacía (primer despliegue).
      - key: SEED_DEMO
        value: "false"
      # --- Frontend (se usan al compilar) ---
      - key: VITE_API_URL
        value: /api
      - key: VITE_UPLOADS_URL
        value: /uploads
